<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Aquila Fernando Alves Silva">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
    <title>Calculadora</title>
</head>

<body>
    <div class="calculadora">
        <div class="container">
            <div class="display">
                <input id="display" type="text" dir="rtl" value="0" class="output"></input>
                <div>
                    <button id="apagar">⌫</button>
                    <button id="resultado">Resultado</button>
                </div>
            </div>
            <div class="num">
                <div>
                    <button id="7">7</button>
                    <button id="8">8</button>
                    <button id="9">9</button>
                </div>
                <div>
                    <button id="4">4</button>
                    <button id="5">5</button>
                    <button id="6">6</button>
                </div>

                <div>
                    <button id="1">1</button>
                    <button id="2">2</button>
                    <button id="3">3</button>
                </div>

                <div>
                    <button id="0">0</button>
                    <button id="virgula">,</button>
                </div>
                <div>
                    <button id="mais">+</button>
                    <button id="menos">-</button>
                    <button id="mult">*</button>
                    <button id="divisao">/</button>
                </div>


            </div>


        </div>

    </div>



</body>

</html>
